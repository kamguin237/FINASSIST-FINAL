services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: finassist-sqlserver
    environment:
      SA_PASSWORD: "FinAssist@2024!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "FinAssist@2024!", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: finassist-backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=FinAssistDB;User Id=sa;Password=FinAssist@2024!;TrustServerCertificate=True;"
      Jwt__Secret: "FinAssistDevSecretKey_MinimumOf32Characters!"
      Jwt__Issuer: "FinAssist.API"
      Jwt__Audience: "FinAssist.Client"
      Jwt__ExpirationMinutes: "60"
      Signature__Secret: "FinAssistSignatureSecret_MinimumOf32Chars!"
      AllowedOrigins: "http://localhost:4200,http://frontend:80"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: finassist-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  sqlserver_data:
