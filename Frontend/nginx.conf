server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Limite de taille des requêtes (pièces jointes, multipart/form-data)
    client_max_body_size 50M;

    # Header pour bypasser l'avertissement ngrok sur toutes les réponses
    add_header ngrok-skip-browser-warning "true" always;

    # Gestion du routing Angular (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service Worker — servi sans cache avec le bon scope
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        add_header ngrok-skip-browser-warning "true" always;
        try_files $uri =404;
    }

    # Proxy WebSocket SignalR — doit être AVANT le bloc /api/
    location /api/hubs/ {
        proxy_pass http://backend:8080/api/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy vers le backend API
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
